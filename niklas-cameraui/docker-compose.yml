version: '3.7'

services:
  app_proxy:
    environment:
      # Hier sagen wir Umbrel, wo das Webinterface läuft: 
      # nämlich bei unserem "server" (Übersetzer) auf Port 8081.
      APP_HOST: niklas-cameraui_server_1
      APP_PORT: 8081

  app:
    image: ghcr.io/cameraui/camera.ui:latest
    restart: on-failure
    network_mode: "host"
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ${APP_DATA_DIR}/data:/data
  server:
    # Dieser Hilfs-Container fungiert als "Übersetzer" zwischen Umbrel und Camera.UI.
    # Umbrel spricht nur normales HTTP (über Port 8081), Camera.UI verlangt aber HTTPS (auf Port 3443).
    image: alpine/socat
    restart: on-failure
    command: tcp-listen:8081,fork,reuseaddr openssl-connect:192.168.1.2:3443,verify=0
  tailscale:
    image: tailscale/tailscale:latest
    hostname: cameraui
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:cameraui
    volumes:
      - ${APP_DATA_DIR}/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    command: >
      sh -c "
      tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
      sleep 5;
      tailscale up --hostname=cameraui --accept-routes;
      tailscale serve --bg https / https+insecure://host.docker.internal:3443;
      wait
      "
