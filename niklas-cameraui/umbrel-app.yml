description: >-
  Camera.UI is a complete NVR with smart AI person/vehicle/face detection.
  
  Supports HomeKit Secure Video natively.
  
  Features:
  - Connect your RTSP, RTMP or HTTP cameras.
  - Smart AI object detection (Person, Vehicle, Face, Animal).
  - P2P support for cameras like Eufy.
  - Includes go2rtc for zero-latency WebRTC streams.
  - Full secure remote access via Tailscale.
